<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12100d">
<title>Bookshelf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="update" role="status" hidden><span>New version available</span><button id="updateBtn">Update</button></div>
<main id="library">
  <header>
    <button class="round" id="backBtn" aria-label="Back" hidden></button>
    <h1><span id="title">Bookshelf</span><small id="subtitle"></small></h1>
    <button class="round" id="favBtn" aria-label="Favorite folder" hidden></button>
    <button class="round" id="menuBtn" aria-label="Settings"></button>
  </header>
  <div class="search" id="searchBox">
    <span id="searchIcon"></span>
    <input id="search" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search">
    <button id="clearSearch" aria-label="Clear search" hidden>✕</button>
  </div>
  <div id="banner" hidden></div>
  <div id="content"></div>
</main>

<div id="reader" hidden>
  <div id="stage"><div id="strip"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div></div>
  <div id="loading" hidden>Opening…</div>
  <div class="bar top" id="topBar" hidden>
    <button class="round" id="rClose" aria-label="Close book"></button>
    <span id="rTitle"></span>
    <button class="round" id="rFav" aria-label="Favorite book"></button>
    <button class="round" id="rMark" aria-label="Bookmark this page"></button>
    <button class="round" id="rToc" aria-label="Contents and bookmarks"></button>
    <button class="round" id="rSet" aria-label="Book settings"></button>
  </div>
  <div class="bar bottom" id="bottomBar" hidden>
    <input type="range" id="slider" min="0" step="1">
    <div class="row"><span id="pageLabel"></span><button class="text" id="goTo">Go to page…</button></div>
  </div>
</div>

<div id="sheetBack" hidden><div id="sheet" role="dialog"></div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
